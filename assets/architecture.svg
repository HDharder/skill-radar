<svg viewBox="0 0 980 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="560" fill="#ffffff"/>

  <!-- 1. user prompt -->
  <rect x="40" y="30" width="220" height="60" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="150" y="55" text-anchor="middle" font-size="14" font-weight="600" fill="#1e1b4b">User message</text>
  <text x="150" y="74" text-anchor="middle" font-size="11" fill="#4338ca">"can you triage the issues..."</text>

  <!-- 2. hook UserPromptSubmit -->
  <rect x="40" y="140" width="220" height="70" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="150" y="165" text-anchor="middle" font-size="14" font-weight="600" fill="#7c2d12">UserPromptSubmit hook</text>
  <text x="150" y="183" text-anchor="middle" font-size="11" fill="#9a3412">hint.py</text>
  <text x="150" y="198" text-anchor="middle" font-size="10" fill="#9a3412">(runs before Claude sees the message)</text>

  <!-- 3. discover.py scan -->
  <rect x="340" y="140" width="230" height="70" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="455" y="165" text-anchor="middle" font-size="14" font-weight="600" fill="#14532d">discover.py</text>
  <text x="455" y="183" text-anchor="middle" font-size="11" fill="#166534">scans ~/.claude/skills,</text>
  <text x="455" y="198" text-anchor="middle" font-size="11" fill="#166534">~/.agents/skills, plugins/cache</text>

  <!-- 4. cache fingerprint -->
  <rect x="340" y="30" width="230" height="60" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="455" y="52" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">discovered.json (cache)</text>
  <text x="455" y="70" text-anchor="middle" font-size="10" fill="#475569">only rescans if something changed</text>

  <!-- 5. indices -->
  <rect x="640" y="140" width="300" height="70" rx="10" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="790" y="162" text-anchor="middle" font-size="13" font-weight="600" fill="#581c87">index.json (curated) + discovered.json (auto)</text>
  <text x="790" y="182" text-anchor="middle" font-size="11" fill="#6b21a8">every skill with</text>
  <text x="790" y="198" text-anchor="middle" font-size="11" fill="#6b21a8">disable-model-invocation: true</text>

  <!-- 6. matching tiers -->
  <rect x="140" y="270" width="700" height="140" rx="12" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/>
  <text x="490" y="295" text-anchor="middle" font-size="14" font-weight="700" fill="#713f12">matching tiers (most to least specific)</text>

  <rect x="165" y="315" width="150" height="70" rx="8" fill="#ffffff" stroke="#ca8a04"/>
  <text x="240" y="337" text-anchor="middle" font-size="11" font-weight="600" fill="#713f12">1. strong phrase</text>
  <text x="240" y="353" text-anchor="middle" font-size="9.5" fill="#854d0e">"grill me", "to-spec"</text>
  <text x="240" y="366" text-anchor="middle" font-size="9.5" fill="#854d0e">fires alone</text>

  <rect x="332" y="315" width="150" height="70" rx="8" fill="#ffffff" stroke="#ca8a04"/>
  <text x="407" y="337" text-anchor="middle" font-size="11" font-weight="600" fill="#713f12">2. name parts</text>
  <text x="407" y="353" text-anchor="middle" font-size="9.5" fill="#854d0e">"untangle" + "codebase"</text>
  <text x="407" y="366" text-anchor="middle" font-size="9.5" fill="#854d0e">non-adjacent, 2+ parts</text>

  <rect x="499" y="315" width="150" height="70" rx="8" fill="#ffffff" stroke="#ca8a04"/>
  <text x="574" y="337" text-anchor="middle" font-size="11" font-weight="600" fill="#713f12">3. weak fallback</text>
  <text x="574" y="353" text-anchor="middle" font-size="9.5" fill="#854d0e">words from the description</text>
  <text x="574" y="366" text-anchor="middle" font-size="9.5" fill="#854d0e">needs 2+ hits</text>

  <rect x="666" y="315" width="150" height="70" rx="8" fill="#ffffff" stroke="#dc2626"/>
  <text x="741" y="337" text-anchor="middle" font-size="11" font-weight="600" fill="#7f1d1d">4. ambiguous+context</text>
  <text x="741" y="353" text-anchor="middle" font-size="9.5" fill="#991b1b">"retro" + "session"</text>
  <text x="741" y="366" text-anchor="middle" font-size="9.5" fill="#991b1b">bare word needs a pair</text>

  <!-- 7. additionalContext -->
  <rect x="320" y="450" width="340" height="70" rx="10" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="490" y="475" text-anchor="middle" font-size="13" font-weight="600" fill="#0e4650">additionalContext injected</text>
  <text x="490" y="494" text-anchor="middle" font-size="10.5" fill="#155e63">"Possibly applicable skill: /triage — high risk..."</text>
  <text x="490" y="510" text-anchor="middle" font-size="10" fill="#155e63">(never invokes alone — only suggests)</text>

  <!-- arrows -->
  <path d="M150,90 L150,138" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <path d="M260,175 L338,175" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <path d="M455,138 L455,92" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" fill="none" stroke-dasharray="4 3"/>
  <path d="M570,175 L638,175" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <path d="M790,212 L790,245 L490,245 L490,268" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <path d="M490,412 L490,448" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
</svg>
